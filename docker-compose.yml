# ============================================================================
# DataPulse Multi-Container Stack (docker-compose.yml)
# Bounded memory allocations respecting 6GB WSL2 .wslconfig governance
# ============================================================================

services:
  connectors-ts:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.connector
    container_name: datapulse-connectors-ts
    ports:
      - "${CONNECTOR_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - WEBHOOK_HMAC_SECRET=${WEBHOOK_HMAC_SECRET:-default-hmac-secret}
      - ENFORCE_HMAC=${ENFORCE_HMAC:-false}
      - PYTHONPATH=/app/core-engine/src
      - DUCKDB_DATABASE_PATH=/app/data/local_warehouse.duckdb
      - HUBSPOT_API_BASE_URL=http://127.0.0.1:3000
      - AIRFLOW_API_BASE_URL=http://airflow-orchestrator:8080
      - AIRFLOW_USERNAME=admin
      - AIRFLOW_PASSWORD=datapulse2026
    volumes:
      - ./core-engine:/app/core-engine:ro
      - ./syncs:/app/syncs:ro
      - ./scripts:/app/scripts:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M

  core-engine:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.engine
    container_name: datapulse-core-engine
    restart: "no"
    depends_on:
      connectors-ts:
        condition: service_healthy
    environment:
      - SOURCE_ENGINE=${SOURCE_ENGINE:-duckdb_local}
      - DEMO_SEED_ENABLED=${DEMO_SEED_ENABLED:-true}
      - DUCKDB_DATABASE_PATH=/app/data/local_warehouse.duckdb
      - HUBSPOT_API_BASE_URL=http://connectors-ts:3000
      - WEBHOOK_HMAC_SECRET=${WEBHOOK_HMAC_SECRET:-default-hmac-secret}
      - ALERT_PROVIDER=${ALERT_PROVIDER:-console}
      - AI_PROVIDER=${AI_PROVIDER:-heuristic_local}
    volumes:
      - ./data:/app/data
      - ./syncs:/app/syncs:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "datapulse init && datapulse run --manifest syncs/hubspot_profitability.yml"
    deploy:
      resources:
        limits:
          memory: 1G

  airflow-orchestrator:
    image: apache/airflow:2.10.2-python3.12
    container_name: datapulse-airflow-orchestrator
    depends_on:
      connectors-ts:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=datapulse2026
      - _PIP_ADDITIONAL_REQUIREMENTS=${_PIP_ADDITIONAL_REQUIREMENTS:-duckdb>=1.0.0 pydantic>=2.0 pyyaml>=6.0}
      - PYTHONPATH=/opt/airflow/core-engine/src
      - SOURCE_ENGINE=${SOURCE_ENGINE:-duckdb_local}
      - DEMO_SEED_ENABLED=${DEMO_SEED_ENABLED:-true}
      - DUCKDB_DATABASE_PATH=/opt/airflow/data/local_warehouse.duckdb
      - HUBSPOT_API_BASE_URL=http://connectors-ts:3000
    volumes:
      - ./orchestration/dags:/opt/airflow/dags:ro
      - ./core-engine:/opt/airflow/core-engine:ro
      - ./syncs:/opt/airflow/syncs:ro
      - ./data:/opt/airflow/data
    ports:
      - "8080:8080"
    command:
      - bash
      - -c
      - |
        rm -f /opt/airflow/airflow-webserver.pid /opt/airflow/airflow-webserver-monitor.pid
        airflow db migrate && (airflow users create --username admin --password datapulse2026 --firstname Darwin --lastname Abarca --role Admin --email admin@datapulse.local || airflow users reset-password --username admin --password datapulse2026)
        exec airflow standalone
    deploy:
      resources:
        limits:
          memory: 3G
