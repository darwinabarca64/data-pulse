# ============================================================================
# DataPulse Multi-Container Stack (docker-compose.yml)
# Bounded memory allocations respecting 6GB WSL2 .wslconfig governance
# ============================================================================

services:
  connectors-ts:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.connector
    container_name: datapulse-connectors-ts
    ports:
      - "${CONNECTOR_PORT:-3001}:3000"
    environment:
      - PORT=3000
      - WEBHOOK_HMAC_SECRET=${WEBHOOK_HMAC_SECRET:-default-hmac-secret}
      - ENFORCE_HMAC=${ENFORCE_HMAC:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  core-engine:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.engine
    container_name: datapulse-core-engine
    depends_on:
      connectors-ts:
        condition: service_healthy
    environment:
      - SOURCE_ENGINE=${SOURCE_ENGINE:-duckdb_local}
      - DEMO_SEED_ENABLED=${DEMO_SEED_ENABLED:-true}
      - DUCKDB_DATABASE_PATH=/app/data/local_warehouse.duckdb
      - HUBSPOT_API_BASE_URL=http://connectors-ts:3000
      - WEBHOOK_HMAC_SECRET=${WEBHOOK_HMAC_SECRET:-default-hmac-secret}
      - ALERT_PROVIDER=${ALERT_PROVIDER:-console}
      - AI_PROVIDER=${AI_PROVIDER:-heuristic_local}
    volumes:
      - ./data:/app/data
      - ./syncs:/app/syncs:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "datapulse init && datapulse run --manifest syncs/hubspot_profitability.yml"
    deploy:
      resources:
        limits:
          memory: 1G

  airflow-orchestrator:
    image: apache/airflow:2.10.2-python3.12
    container_name: datapulse-airflow-orchestrator
    profiles:
      - orchestration
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _PIP_ADDITIONAL_REQUIREMENTS=${_PIP_ADDITIONAL_REQUIREMENTS:-duckdb>=1.0.0 pydantic>=2.0 pyyaml>=6.0}
      - PYTHONPATH=/opt/airflow/core-engine/src
      - SOURCE_ENGINE=${SOURCE_ENGINE:-duckdb_local}
      - DEMO_SEED_ENABLED=${DEMO_SEED_ENABLED:-true}
      - DUCKDB_DATABASE_PATH=/opt/airflow/data/local_warehouse.duckdb
      - HUBSPOT_API_BASE_URL=${HUBSPOT_API_BASE_URL:-http://host.docker.internal:3000}
    volumes:
      - ./orchestration/dags:/opt/airflow/dags:ro
      - ./core-engine:/opt/airflow/core-engine:ro
      - ./syncs:/opt/airflow/syncs:ro
      - ./data:/opt/airflow/data
    ports:
      - "8080:8080"
    command: standalone
    deploy:
      resources:
        limits:
          memory: 2G
