[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-pulse"
version = "0.1.0"
description = "Enterprise-grade open-source Reverse ETL engine with FinOps & Zero-Trust RBAC governance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Darwin Miguel Abarca Vargas" }
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "duckdb>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
snowflake = [
    "snowflake-connector-python>=3.10.0",
    "cryptography>=42.0.0",
]

[project.scripts]
datapulse = "datapulse.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["core-engine/src"]

[tool.pytest.ini_options]
testpaths = ["tests", "core-engine/tests", "orchestration/tests"]
pythonpath = [".", "core-engine/src"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["core-engine/src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = ["core-engine/src"]
